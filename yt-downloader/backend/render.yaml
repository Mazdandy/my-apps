# Render Blueprint — LOTC - Video Downloader Backend
# Deploy via: Render dashboard → Blueprint → point at the monorepo repo root.
services:
  - type: web
    name: video-downloader-backend
    runtime: docker
    # Context must be the repo root: the npm lockfile lives there, not in backend/.
    dockerContext: .
    dockerfilePath: yt-downloader/backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      # Lock CORS to your deployed frontend origin (no trailing slash)
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
